name: SQ Music listening frontend release
on:
  push:
    branches: ['v3']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sqmusic-web-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package frontend overlay
        run: |
          mkdir -p release/web
          cp -r dist release/web/dist
          cp deploy/Web.Dockerfile release/web/Dockerfile
          tar -czf release/web.tar.gz -C release/web .
      - name: Publish immutable artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="listening-${GITHUB_SHA}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          gh release create "$TAG" release/web.tar.gz --target "$GITHUB_SHA" --title "Listening frontend ${GITHUB_SHA:0:8}" --notes 'Desktop and mobile listening room, library, lyrics, downloads and playlist tools.'
      - name: Publish verified references to private GitOps
        if: vars.NAS_GITOPS_REPO != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.NAS_GITOPS_REPO }}
          ref: main
          path: gitops
          ssh-key: ${{ secrets.NAS_GITOPS_KEY }}
      - name: Update desired release
        if: vars.NAS_GITOPS_REPO != ''
        run: |
          python -m pip install PyYAML==6.0.3
          python scripts/update-gitops.py gitops web ${{ github.repository }} "$TAG" release
